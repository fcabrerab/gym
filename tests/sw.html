<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Pruebas del service worker de Gym</title>
</head>
<body>
  <pre id="resultado">Cargando las pruebas…</pre>
  <script type="module">
    // Service worker de la app (casos W1-W12), con la mudanza desde la beta (D-121: W1, W9, W11 y W12). Va aparte de
    // tests/index.html y todo se espera con real() o hastaQue().
    const local = ["127.0.0.1", "localhost"].includes(location.hostname);
    if (!local) {
      document.getElementById("resultado").textContent = "Estas pruebas solo se ejecutan en 127.0.0.1 o localhost.";
    } else {
      const c = await import("./comun.js");
      const { datosBeta } = await import("./datos.js");
      const { caso, nota, fin, real, hastaQue, limpiarBeta, guardar, esperarListo, quitar, esperar } = c;
      document.getElementById("resultado").textContent = "";
      c.suite("sw");
      try {
        const sw = await fetch("/sw.js", { cache: "no-store" }).then((r) => r.text());
        const version = sw.match(/const VERSION = "([^"]+)"/)[1];
        const nombre = `gym-beta-${version}`;
        const archivos = [...sw.match(/const ARCHIVOS = \[([\s\S]*?)\];/)[1].matchAll(/"([^"]+)"/g)].map((m) => m[1]);
        const rutasArchivos = archivos.map((a) => (a === "./" ? "/" : `/${a.replace(/^\.\//, "")}`));
        const rutasDe = async (cache) => {
          const ca = await caches.open(cache);
          return (await ca.keys()).map((r) => new URL(r.url).pathname);
        };
        const ajena = (ruta) => /^\/(data|tests|beta)\//.test(ruta);

        await limpiarBeta();
        for (const n of await real(caches.keys())) if (n.startsWith("gym-beta-") || n.startsWith("gym-pwa-")) await real(caches.delete(n));
        const c1 = await real(caches.open("gym-beta-viejo"));
        await real(c1.put("/viejo.txt", new Response("viejo")));
        // La caché de la app vieja (su service worker estaba en la raíz): con ella, es la mudanza.
        const c2 = await real(caches.open("gym-pwa-v16"));
        await real(c2.put("/styles.css", new Response("/* la hoja de la app vieja */")));
        const c3 = await real(caches.open("otra-app"));
        await real(c3.put("/otra/index.html", new Response("otra")));
        guardar("gym-beta-datos", await datosBeta());

        // W1 instalar y activar (con la app vieja: sin esperar, y la página se recarga una vez)
        const f = document.createElement("iframe");
        f.style.width = "412px";
        f.style.height = "915px";
        document.body.append(f);
        await new Promise((r) => { f.onload = r; f.src = "/?ahora=2026-11-03T18:00:00"; });
        await esperarListo(f);
        const activo = await hastaQue(async () => {
          const reg = await navigator.serviceWorker.getRegistration("/");
          return Boolean(reg?.active) && reg.active.state === "activated";
        });
        const reg = await real(navigator.serviceWorker.getRegistration("/"));
        nota(`tiempo virtual al activarse: ${Math.round(performance.now() / 1000)} s`);
        caso(activo && new URL(reg.scope).pathname === "/", `W1 el service worker se activa con alcance ${reg ? new URL(reg.scope).pathname : "—"}`);
        await hastaQue(async () => !(await caches.keys()).includes("gym-beta-viejo"), 100);
        const nombres = await real(caches.keys());
        const guardados = await real(rutasDe(nombre));
        const faltan = rutasArchivos.filter((r) => !guardados.includes(r));
        caso(nombres.includes(nombre) && faltan.length === 0, `W1 existe ${nombre} con todos los ARCHIVOS (${guardados.length})${faltan.length ? `; faltan ${faltan.join(", ")}` : ""}`);
        caso(!nombres.includes("gym-beta-viejo") && !nombres.includes("gym-pwa-v16") && nombres.includes("otra-app"),
          `W1 borra la caché vieja de la beta y la de la app vieja, y no otras (quedan: ${nombres.join(", ")})`);
        const recargada = await hastaQue(() => f.contentWindow?.performance.getEntriesByType("navigation")[0]?.type === "reload"
          && f.contentDocument?.documentElement?.dataset?.listo === "1", 200);
        caso(recargada && f.contentWindow.navigator.serviceWorker.controller?.scriptURL.endsWith("/sw.js"),
          "W1 la mudanza: al tomar el control el service worker nuevo, la página se recarga sola una vez");

        // W2 tras recargar, controlada y pinta
        await new Promise((r) => { f.onload = r; f.contentWindow.location.reload(); });
        const listo = await esperarListo(f);
        const controlador = f.contentWindow.navigator.serviceWorker.controller;
        caso(listo === "1" && controlador?.scriptURL.endsWith("/sw.js"), `W2 tras recargar, la app está controlada por su service worker y pinta (listo ${listo})`);
        const ajustes = f.contentDocument.querySelector('#nav [data-accion="ir-ajustes"]');
        ajustes.click();
        await c.esperar(50);
        caso(c.textoDe(f.contentDocument, "#sin-conexion") === "Funciona sin conexión: sí", `W2 Ajustes dice «${c.textoDe(f.contentDocument, "#sin-conexion")}»`);
        const hoja = [...f.contentDocument.styleSheets].find((s) => s.href && new URL(s.href).pathname === "/styles.css");
        caso(Boolean(hoja) && hoja.cssRules.length > 50, `W2 la hoja de estilos es la de la app (${hoja?.cssRules.length ?? 0} reglas), no la vieja`);

        // W3 nada de fuera de la app en sus cachés (ni la rutina publicada aunque la pida la app)
        await real(f.contentWindow.fetch("/data/routine.json", { cache: "no-store" }).then((r) => r.text()));
        const conAjenas = [];
        for (const n of (await real(caches.keys())).filter((x) => x.startsWith("gym-beta-"))) {
          const rutas = await real(rutasDe(n));
          if (rutas.some(ajena)) conAjenas.push(n);
        }
        caso(conAjenas.length === 0, `W3 ninguna caché gym-beta-* tiene nada de data/, tests/ ni beta/${conAjenas.length ? ` (${conAjenas.join(", ")})` : ""}`);

        // W4 versión por mensaje
        const respuesta = new Promise((resolver) => {
          navigator.serviceWorker.addEventListener("message", (ev) => { if (ev.data?.tipo === "version") resolver(ev.data.version); });
        });
        navigator.serviceWorker.startMessages?.();
        reg.active.postMessage({ tipo: "version" });
        const v = await real(Promise.race([respuesta, new Promise((r) => setTimeout(() => r(null), 3000))]));
        caso(v === version, `W4 {tipo: "version"} responde ${v}`);

        // W5 todo lo que carga la app está en ARCHIVOS
        const recursos = f.contentWindow.performance.getEntriesByType("resource").map((e) => new URL(e.name))
          .filter((u) => u.origin === location.origin && !ajena(u.pathname)).map((u) => u.pathname);
        const fuera = [...new Set(recursos)].filter((r) => !rutasArchivos.includes(r));
        caso(recursos.length >= 15 && fuera.length === 0, `W5 los ${new Set(recursos).size} recursos de la app que cargó están en ARCHIVOS${fuera.length ? `; fuera: ${fuera.join(", ")}` : ""}`);

        // W6 manifiesto: «Gym», con el start_url de la app vieja (la identidad de la app instalada: D-121)
        const manifiesto = await real(fetch("/manifest.json", { cache: "no-store" }).then((r) => r.json()));
        // Los iconos: un PNG de 512 (Android lo prefiere para instalar y para las notificaciones) y el SVG.
        const iconos = await real(Promise.all(manifiesto.icons.map((i) => fetch(new URL(i.src, new URL("/", location.href)), { cache: "no-store" })
          .then((r) => ({ ...i, ok: r.ok, tipo: r.headers.get("content-type") || "" })))));
        const png = iconos.find((i) => i.type === "image/png" && i.sizes === "512x512");
        caso(manifiesto.name === "Gym" && manifiesto.start_url === "./index.html" && manifiesto.scope === "./" && png?.ok && png.tipo.includes("png")
          && iconos.every((i) => i.ok) && iconos.some((i) => i.tipo.includes("svg")),
          `W6 manifiesto «${manifiesto.name}», start_url «${manifiesto.start_url}», scope «./», y sus iconos existen (${iconos.map((i) => `${i.src} ${i.ok ? "bien" : "falta"}`).join(", ")})`);
        const insignia = await real(fetch("/insignia-512.png", { cache: "no-store" }));
        caso(insignia.ok && (insignia.headers.get("content-type") || "").includes("png"), "W6 la insignia de las notificaciones (mancuerna blanca) existe");

        // W7 la caché se rehace sola
        const cache = await real(caches.open(nombre));
        const borrada = new URL("/js/util.js", location.href).href;
        await real(cache.delete(borrada));
        const quitada = !(await real(cache.match(borrada)));
        reg.active.postMessage({ tipo: "comprobar" });
        const vuelve = await hastaQue(async () => Boolean(await (await caches.open(nombre)).match(borrada)), 200);
        caso(quitada && vuelve, "W7 tras borrar una entrada y mandar {tipo: \"comprobar\"}, vuelve a estar");

        // Respuestas de error: no se guardan
        const r404 = await real(f.contentWindow.fetch("/no-existe-404.js").catch(() => null));
        const aparece = await hastaQue(async () => Boolean(await (await caches.open(nombre)).match("/no-existe-404.js")), 30);
        caso(r404?.status === 404 && !aparece, `Una respuesta ${r404?.status} no se guarda en la caché de la app`);

        quitar({ f });
        await real(reg.unregister());
        for (const n of await real(caches.keys())) if (n.startsWith("gym-beta-") || n.startsWith("gym-pwa-") || n === "otra-app") await real(caches.delete(n));
        await limpiarBeta();
        nota(`service worker quitado y cachés de prueba borradas (tiempo virtual: ${Math.round(performance.now() / 1000)} s; peticiones de espera: ${c.contarSondeos()})`);
      } catch (err) {
        caso(false, `excepción: ${err?.message || err}`);
      }

      // W8 Caja de arena: el texto de /sw.js con un «self» de mentira, una red de mentira y una Cache Storage de
      // mentira (en memoria: lo que se prueba es la lógica de la navegación; la Cache Storage de verdad ya la usan W1-W7,
      // y aquí, sin service worker de por medio, a veces se quedaba colgada). Así se prueba qué hace la navegación cuando
      // llega el index.html de otra versión, cuando se abre otro archivo de la app, con una versión esperando y sin red.
      try {
        const codigo = (await real(fetch("/sw.js", { cache: "no-store" }).then((r) => r.text())))
          .replace(/const VERSION = "[^"]+";/, 'const VERSION = "prueba-sw";');
        const CACHE_P = "gym-beta-prueba-sw";
        const almacenes = new Map();
        const clave = (r) => new URL(typeof r === "string" ? r : r.url, location.href).href;
        const sinBusqueda = (u) => u.split("?")[0];
        const cacheFalsa = (mapa) => ({
          match: async (r, opciones = {}) => {
            for (const [url, res] of mapa) {
              if (url === clave(r) || (opciones.ignoreSearch && sinBusqueda(url) === sinBusqueda(clave(r)))) return res.clone();
            }
            return undefined;
          },
          put: async (r, res) => { mapa.set(clave(r), res); },
          delete: async (r) => mapa.delete(clave(r)),
          keys: async () => [...mapa.keys()].map((u) => new Request(u)),
        });
        const cachesFalsas = {
          open: async (n) => {
            if (!almacenes.has(n)) almacenes.set(n, new Map());
            return cacheFalsa(almacenes.get(n));
          },
          keys: async () => [...almacenes.keys()],
          delete: async (n) => almacenes.delete(n),
        };
        const red = { sinRed: false, respuestas: new Map(), pedidas: [] };
        const manejadores = {};
        const registro = { waiting: null, actualizaciones: 0, update: async () => { registro.actualizaciones += 1; } };
        const selfFalso = {
          location: new URL("/sw.js", location.href), registration: registro, addEventListener: (t, fn) => { manejadores[t] = fn; },
          clients: { claim: async () => {}, matchAll: async () => [], openWindow: async () => null }, skipWaiting: () => {},
        };
        const fetchFalso = async (peticion) => {
          const url = typeof peticion === "string" ? peticion : peticion.url;
          red.pedidas.push(new URL(url, location.href).pathname);
          if (red.sinRed) throw new TypeError("Failed to fetch");
          const r = red.respuestas.get(new URL(url, location.href).pathname);
          return r ? r() : new Response("no", { status: 404 });
        };
        // setTimeout inerte: el límite de 4 s de la navegación no hace falta con esta red (responde al momento) y así el
        // reloj virtual no salta a esos temporizadores.
        // eslint-disable-next-line no-new-func -- solo en esta página de pruebas, que solo corre en 127.0.0.1
        new Function("self", "fetch", "caches", "setTimeout", codigo)(selfFalso, fetchFalso, cachesFalsas, () => 0);
        const navegar = async (ruta) => {
          let respuesta = null;
          manejadores.fetch({
            request: { url: new URL(ruta, location.href).href, method: "GET", mode: "navigate", destination: "document" },
            respondWith: (p) => { respuesta = p; }, waitUntil: () => {},
          });
          const r = respuesta ? await respuesta : null;
          await esperar(0); // lo que el service worker guarda «sin esperar» (cache.put) ya ha terminado
          return r;
        };
        const guardado = async () => {
          const r = await (await cachesFalsas.open(CACHE_P)).match(new URL("/index.html", location.href).href);
          return r ? r.text() : null;
        };
        const html = (v) => () => new Response(`<!doctype html><meta name="gym-beta-version" content="${v}"><title>Gym ${v}</title>`, { headers: { "Content-Type": "text/html; charset=utf-8" } });

        red.respuestas.set("/", html("prueba-sw"));
        const r1 = await navegar("/?desde=icono");
        caso(r1?.status === 200 && (await guardado())?.includes("prueba-sw"), "W8 con red, el index.html de esta versión se guarda");

        red.respuestas.set("/", html("9.9.9"));
        const r2 = await navegar("/");
        const t2 = r2 ? await r2.text() : "";
        caso(t2.includes("prueba-sw") && (await guardado())?.includes("prueba-sw") && registro.actualizaciones === 1,
          "W8 si llega el index.html de otra versión, se sigue con el de esta (no se mezcla con sus módulos) y se busca la nueva");

        red.respuestas.set("/manifest.json", () => new Response('{"name":"x"}', { headers: { "Content-Type": "application/json" } }));
        const r3 = await navegar("/manifest.json");
        caso(r3 && (await r3.text()).includes('"name"') && (await guardado())?.includes("prueba-sw"), "W8 abrir otro archivo de la app en una pestaña no pisa el index.html guardado");

        registro.waiting = {};
        red.pedidas.length = 0;
        const r4 = await navegar("/");
        caso(Boolean(r4) && (await r4.text()).includes("prueba-sw") && !red.pedidas.includes("/"), "W8 con una versión esperando, la navegación sale de la caché de esta (hasta «Recargar»)");
        registro.waiting = null;

        // Lo de fuera de la app (data/, tests/, beta/) no lo atiende: ni al navegar ni al pedirlo.
        const atiende = (ruta, modo) => {
          let si = false;
          manejadores.fetch({
            request: { url: new URL(ruta, location.href).href, method: "GET", mode: modo, destination: modo === "navigate" ? "document" : "script" },
            respondWith: () => { si = true; }, waitUntil: () => {},
          });
          return si;
        };
        caso(!atiende("/beta/", "navigate") && !atiende("/beta/sw.js", "same-origin") && !atiende("/data/routine.json", "cors") && !atiende("/tests/comun.js", "cors")
          && atiende("/js/app.js", "cors") && atiende("/index.html", "navigate"),
        "W8 no atiende data/, tests/ ni beta/ (y sí lo de la app)");

        await cachesFalsas.delete(CACHE_P);
        red.sinRed = true;
        const r5 = await navegar("/");
        const t5 = r5 ? await r5.text() : "";
        caso(r5?.status === 503 && (r5.headers.get("content-type") || "").includes("text/html") && t5.includes("Sin conexión") && t5.includes('href="./"') && !t5.includes("normal"),
          "W8 sin red y sin copia: una página para volver a intentarlo (ya sin enlace a la versión vieja)");
      } catch (err) {
        caso(false, `excepción en la caja de arena de la app: ${err?.message || err}`);
      }

      // W9 La mudanza (D-121), en la caja de arena: al instalarse, si quedan cachés de la app vieja (gym-pwa-…), no espera
      // a «Recargar» (skipWaiting); al activarse, borra esas y las de versiones viejas de la beta, y deja la suya, la de
      // imágenes y las de otras apps.
      try {
        const codigo = await real(fetch("/sw.js", { cache: "no-store" }).then((r) => r.text()));
        const version = codigo.match(/const VERSION = "([^"]+)"/)[1];
        const probar = async (iniciales) => {
          const almacenes = new Map(iniciales.map((n) => [n, new Map()]));
          const cachesFalsas = {
            open: async (n) => {
              if (!almacenes.has(n)) almacenes.set(n, new Map());
              const m = almacenes.get(n);
              return { addAll: async (peticiones) => { for (const p of peticiones) m.set(p.url, true); }, put: async () => {}, match: async () => undefined, keys: async () => [], delete: async () => true };
            },
            keys: async () => [...almacenes.keys()],
            delete: async (n) => almacenes.delete(n),
          };
          const manejadores = {};
          const cuenta = { saltos: 0, reclamos: 0 };
          const selfFalso = {
            location: new URL("/sw.js", location.href), registration: { waiting: null, update: async () => {} },
            addEventListener: (t, fn) => { manejadores[t] = fn; },
            clients: { claim: async () => { cuenta.reclamos += 1; }, matchAll: async () => [] },
            skipWaiting: async () => { cuenta.saltos += 1; },
          };
          // eslint-disable-next-line no-new-func -- solo en esta página de pruebas, que solo corre en 127.0.0.1
          new Function("self", "fetch", "caches", "setTimeout", codigo)(selfFalso, async () => new Response("x"), cachesFalsas, () => 0);
          const lanzar = async (manejador) => {
            const promesas = [];
            manejador({ waitUntil: (p) => promesas.push(p) });
            await Promise.all(promesas);
          };
          await lanzar(manejadores.install);
          const trasInstalar = { saltos: cuenta.saltos, archivos: almacenes.get(`gym-beta-${version}`)?.size ?? 0 };
          await lanzar(manejadores.activate);
          return { ...trasInstalar, quedan: [...almacenes.keys()].sort(), reclamos: cuenta.reclamos };
        };
        const conVieja = await probar(["gym-pwa-v16", "gym-beta-0.2.10", "gym-beta-imagenes", "otra-app"]);
        const sinVieja = await probar(["gym-beta-0.2.10", "gym-beta-imagenes"]);
        caso(conVieja.saltos === 1 && sinVieja.saltos === 0 && conVieja.archivos > 20,
          `W9 al instalarse, sin esperar solo si queda la app vieja (con ella: ${conVieja.saltos}; sin ella: ${sinVieja.saltos}; ${conVieja.archivos} archivos guardados)`);
        caso(JSON.stringify(conVieja.quedan) === JSON.stringify([`gym-beta-${version}`, "gym-beta-imagenes", "otra-app"].sort()) && conVieja.reclamos === 1
          && JSON.stringify(sinVieja.quedan) === JSON.stringify([`gym-beta-${version}`, "gym-beta-imagenes"].sort()),
          `W9 al activarse, borra las de la app vieja y las de la beta vieja (quedan: ${conVieja.quedan.join(", ")})`);
      } catch (err) {
        caso(false, `excepción en la mudanza del service worker: ${err?.message || err}`);
      }

      // W10 Avisos desde el PC: el manejador «push» de /sw.js en su caja de arena (sin Web Push de verdad): con la
      // app oculta sale la notificación; con la app a la vista, no (avisa ella); sin repetir la del final de ese descanso.
      try {
        const codigo = await real(fetch("/sw.js", { cache: "no-store" }).then((r) => r.text()));
        const manejadores = {};
        const mostradas = [];
        const mensajes = [];
        let ventanas = [];
        const registro = {
          waiting: null, update: async () => {},
          showNotification: async (titulo, opciones = {}) => { mostradas.push({ titulo, opciones, data: opciones.data ?? null }); },
          getNotifications: async ({ tag } = {}) => mostradas.filter((n) => !tag || n.opciones.tag === tag),
        };
        const selfFalso = {
          location: new URL("/sw.js", location.href), registration: registro, addEventListener: (t, fn) => { manejadores[t] = fn; },
          clients: { claim: async () => {}, matchAll: async () => ventanas, openWindow: async () => null }, skipWaiting: () => {},
        };
        const cachesFalsas = { open: async () => ({ match: async () => undefined, put: async () => {}, keys: async () => [] }), keys: async () => [], delete: async () => true };
        // eslint-disable-next-line no-new-func -- solo en esta página de pruebas, que solo corre en 127.0.0.1
        new Function("self", "fetch", "caches", "setTimeout", codigo)(selfFalso, async () => new Response("no", { status: 404 }), cachesFalsas, () => 0);
        const empujar = async (datos, { roto = false } = {}) => {
          const promesas = [];
          manejadores.push({ data: { json: () => { if (roto) throw new SyntaxError("no es JSON"); return datos; } }, waitUntil: (p) => promesas.push(p) });
          await Promise.all(promesas);
        };
        const ventana = (ruta, visibilityState) => ({ url: new URL(ruta, location.href).href, visibilityState, postMessage: (m) => mensajes.push(m) });
        const aviso = { tipo: "descanso", id: "abc123", titulo: "Te toca la serie 2 de 3", texto: "Press de pecho", fin: 1793900000000 };

        await empujar(aviso);
        const n1 = mostradas[0];
        caso(mostradas.length === 1 && n1.titulo === "Te toca la serie 2 de 3" && n1.opciones.body === "Press de pecho" && n1.opciones.tag === "gym-beta-descanso"
          && n1.opciones.renotify === true && n1.opciones.timestamp === aviso.fin && n1.data?.fin === true && n1.data.id === "abc123" && n1.data.origen === "pc"
          && n1.opciones.icon === "./icono-512.png" && n1.opciones.badge === "./insignia-512.png",
          `W10 sin la app a la vista, el aviso del PC sale («${n1?.titulo}», etiqueta ${n1?.opciones.tag}, con su hora y su data)`);
        await empujar(aviso);
        caso(mostradas.length === 1, "W10 si ya está la del final de ese descanso, no sale otra");
        mostradas.length = 0;
        ventanas = [ventana("/", "visible")];
        await empujar({ ...aviso, id: "def456" });
        caso(mostradas.length === 0 && mensajes.length === 1 && mensajes[0].tipo === "aviso-pc" && mensajes[0].id === "def456",
          "W10 con la app a la vista, no sale notificación (avisa ella) y se le dice");
        ventanas = [ventana("/", "hidden")];
        await empujar({ ...aviso, id: "ghi789" });
        caso(mostradas.length === 1, "W10 con la app oculta, sí sale");
        mostradas.length = 0;
        ventanas = [ventana("/", "visible")];
        await empujar({ tipo: "prueba", titulo: "Aviso de prueba desde el PC", texto: "Si lo ves…", fin: 1 });
        caso(mostradas.length === 1 && mostradas[0].opciones.tag === "gym-beta-prueba-pc" && mostradas[0].data?.fin === false,
          "W10 el de prueba sale siempre, con su etiqueta, aunque la app esté a la vista");
        mostradas.length = 0;
        ventanas = [];
        await empujar(null, { roto: true });
        caso(mostradas.length === 1 && mostradas[0].titulo === "¡Te toca!" && mostradas[0].opciones.tag === "gym-beta-descanso", "W10 un aviso que no se entiende sale como «¡Te toca!»");
        mostradas.length = 0;
        await empujar({ tipo: "descanso", titulo: "x".repeat(200), texto: 5 });
        caso(mostradas[0]?.titulo.length === 80 && mostradas[0].opciones.body === "", "W10 un título larguísimo se recorta y un texto raro no sale");
      } catch (err) {
        caso(false, `excepción en los avisos del PC del service worker: ${err?.message || err}`);
      }

      // W11 beta/sw.js (la dirección vieja de la beta, D-121), en la caja de arena: se instala sin esperar, borra solo
      // las cachés de la beta vieja (gym-beta-0.…), se da de baja y lleva sus ventanas a la app.
      try {
        const codigo = await real(fetch("/beta/sw.js", { cache: "no-store" }).then((r) => r.text()));
        const almacenes = new Set(["gym-beta-0.2.10", "gym-beta-0.1.0", "gym-beta-1.0.0", "gym-beta-imagenes", "gym-pwa-v16"]);
        const cachesFalsas = { keys: async () => [...almacenes], delete: async (n) => almacenes.delete(n) };
        const manejadores = {};
        const cuenta = { saltos: 0, bajas: 0 };
        const idas = [];
        const suya = { url: new URL("/beta/", location.href).href, navigate: async (u) => { idas.push(u); return null; } };
        const selfFalso = {
          location: new URL("/beta/sw.js", location.href), registration: { unregister: async () => { cuenta.bajas += 1; return true; } },
          addEventListener: (t, fn) => { manejadores[t] = fn; },
          clients: { matchAll: async () => [suya] }, skipWaiting: () => { cuenta.saltos += 1; },
        };
        // eslint-disable-next-line no-new-func -- solo en esta página de pruebas, que solo corre en 127.0.0.1
        new Function("self", "caches", codigo)(selfFalso, cachesFalsas);
        manejadores.install({});
        const promesas = [];
        manejadores.activate({ waitUntil: (p) => promesas.push(p) });
        await Promise.all(promesas);
        const quedan = [...almacenes].sort();
        caso(cuenta.saltos === 1 && cuenta.bajas === 1 && idas.length === 1 && idas[0] === new URL("/", location.href).href
          && JSON.stringify(quedan) === JSON.stringify(["gym-beta-1.0.0", "gym-beta-imagenes", "gym-pwa-v16"]),
          `W11 beta/sw.js se quita solo: sin esperar, borra solo las de la beta vieja (quedan: ${quedan.join(", ")}), se da de baja y lleva a ${idas[0] ?? "—"}`);
      } catch (err) {
        caso(false, `excepción en beta/sw.js: ${err?.message || err}`);
      }

      // W12 beta/index.html lleva a la app con lo que traiga detrás: el enlace de los avisos del PC («#avisos-pc=…»)
      // llega a la app y deja puesta la dirección del PC. Con una beta en marcha en beta/ (D-124), allí está la beta y
      // no lleva a ningún sitio: entonces no se mira (se ve por su js/version.js, que la que solo lleva no tiene).
      const conBeta = (await real(fetch("/beta/js/version.js", { cache: "no-store" }).catch(() => null)))?.ok;
      if (conBeta) nota("W12 no se mira: en beta/ hay una beta en marcha (D-124), no la que solo lleva a la app");
      else try {
        await limpiarBeta();
        guardar("gym-beta-datos", await datosBeta());
        const f2 = document.createElement("iframe");
        f2.style.width = "412px";
        f2.style.height = "915px";
        document.body.append(f2);
        f2.src = "/beta/?sinsw&ahora=2026-11-03T18:00:00#avisos-pc=https://pc.ejemplo.ts.net";
        const llego = await hastaQue(() => f2.contentWindow?.location?.pathname === "/" && f2.contentDocument?.documentElement?.dataset?.listo === "1", 300);
        const direccion = c.leerJson("gym-beta-avisos-pc")?.direccion;
        const donde = `${f2.contentWindow?.location?.pathname}${f2.contentWindow?.location?.search}`;
        caso(llego && f2.contentWindow.location.search.includes("sinsw") && direccion === "https://pc.ejemplo.ts.net",
          `W12 /beta/ lleva a la app con lo de detrás (${donde}; dirección del PC: ${direccion ?? "—"})`);
        f2.remove();
        await limpiarBeta();
      } catch (err) {
        caso(false, `excepción en beta/index.html: ${err?.message || err}`);
      }
      c.suite("");
      nota(`tiempo virtual usado: ${Math.round(performance.now() / 1000)} s; peticiones de espera: ${c.contarSondeos()}`);
      fin();
    }
  </script>
