<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./images/icon.svg">
  <link rel="stylesheet" href="./styles.css?v=6">
  <title>Gym Routine</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Rutina personal</p>
        <h1>Gym Routine</h1>
      </div>
      <div class="header-actions">
        <button id="modeToggleBtn" class="mode-btn icon-btn active" type="button" aria-label="Cambiar a modo editar" aria-pressed="false">✎</button>
        <details class="mini-menu">
          <summary class="mode-btn" aria-label="Abrir menú">☰</summary>
          <div class="mini-menu-panel">
            <div class="menu-section-title">Tema</div>
            <button id="themeLightBtn" class="theme-chip" type="button">Claro</button>
            <button id="themeDarkBtn" class="theme-chip" type="button">Oscuro</button>
            <button id="addDayMenuBtn" class="theme-chip" type="button">Añadir día</button>
            <small class="menu-help">Crea un día nuevo en la rutina.</small>
            <button class="theme-chip" id="exportBtnGlobal" type="button">Exportar datos</button>
            <small class="menu-help">Descarga tus cambios locales en JSON.</small>
            <button class="theme-chip" id="importBtnGlobal" type="button">Importar datos</button>
            <small class="menu-help">Carga un JSON guardado previamente.</small>
            <button class="theme-chip" id="restoreLocalBtnGlobal" type="button">Restaurar datos locales</button>
            <small class="menu-help">Borra solo las personalizaciones locales.</small>
            <button class="theme-chip" id="restoreRoutineBtnGlobal" type="button">Restaurar rutina base</button>
            <small class="menu-help">Vuelve a la rutina base sin borrar PRs.</small>
          </div>
        </details>
      </div>
    </header>

    <div class="day-toolbar">
      <nav class="day-nav" id="dayNav" aria-label="Navegación de días"></nav>
    </div>

    <main id="app" class="app-main" aria-live="polite"></main>
  </div>

  <template id="exerciseCardTemplate">
    <article class="exercise-card">
      <img class="exercise-image" alt="">
      <div class="exercise-body">
        <div class="exercise-title-row">
          <h2 class="exercise-name"></h2>
          <div class="quick-pr">
            <input class="pr-input" type="number" min="0" step="0.5" inputmode="decimal">
            <span>kg</span>
          </div>
        </div>
        <div class="exercise-meta">
          <span class="meta-pill series-pill"></span>
          <span class="meta-pill reps-pill"></span>
          <span class="meta-pill rest-pill"></span>
          <span class="meta-pill muscle-pill"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="./app.js?v=6" type="module"></script>
</body>
</html>
