<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; media-src 'self' blob:; connect-src 'self' https://*.ts.net; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131c2e" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Beta de la app del gimnasio: apunta series, descansos y marcas.">
  <!-- La misma versión que js/version.js y sw.js: si el HTML y el JavaScript no coinciden, la app no arranca a medias. -->
  <meta name="gym-beta-version" content="0.2.5">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Gym Beta</title>
</head>
<body class="arrancando">
  <header class="cabecera" id="cabecera">
    <div class="cabecera-fila">
      <p class="marca"><span class="marca-nombre">Gimnasio</span>
        <button type="button" class="boton-beta" id="boton-beta" aria-label="Beta. Apuntar un fallo o una idea"><span class="pastilla-beta">BETA<svg class="icono" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h4L19.5 8.5l-4-4L4 16z"/></svg></span></button>
      </p>
      <a class="enlace-normal" href="../?normal">
        <svg class="icono" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        <span>Versión normal</span>
      </a>
    </div>
    <div class="fila-dias" id="fila-dias" role="group" aria-label="Días de la rutina" hidden></div>
  </header>

  <main id="pantalla" class="pantalla" tabindex="-1">
    <p class="cargando">Cargando la beta…</p>
  </main>

  <div id="barra-descanso" class="barra-descanso" role="region" aria-label="Descanso" hidden></div>
  <div id="avisos" class="avisos" aria-live="polite"></div>

  <nav id="nav" class="nav" aria-label="Secciones">
    <button type="button" class="nav-boton" data-accion="ir-entreno">
      <svg class="icono" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 7.5v9"/><path d="M17.5 7.5v9"/><path d="M3.5 10v4"/><path d="M20.5 10v4"/><path d="M6.5 12h11"/></svg>
      <span>Entreno</span>
    </button>
    <button type="button" class="nav-boton" data-accion="ir-historial">
      <svg class="icono" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M5.5 15.5l4-5 3.5 3 5.5-7"/></svg>
      <span>Historial</span>
    </button>
    <button type="button" class="nav-boton" data-accion="ir-rutina">
      <svg class="icono" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5h16v14H4z"/><path d="M4 10h16"/><path d="M8.5 3v4"/><path d="M15.5 3v4"/></svg>
      <span>Rutina</span>
    </button>
    <button type="button" class="nav-boton" data-accion="ir-ajustes">
      <svg class="icono" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9"/><path d="M17 7h3"/><path d="M4 17h3"/><path d="M11 17h9"/><path d="M15 4.5v5"/><path d="M9 14.5v5"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="capa-fin" class="capa-fin" role="status" hidden></div>
  <div id="anuncios" class="solo-lector" aria-live="polite"></div>
  <noscript><p class="noscript">La beta necesita JavaScript. Mientras tanto, usa la <a href="../?normal">versión normal</a>.</p></noscript>

  <script src="./js/vigia.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
